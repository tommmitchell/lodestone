<title>LODESTONE — Evidence Workbench (Prototype)</title>
<style>
  :root {
    --paper:#f6f7f8; --card:#ffffff; --ink:#1b2129; --ink-2:#4a545f; --ink-3:#6e7883;
    --line:#d8dde2; --cobalt:#2c55a8; --cobalt-soft:#e8eef8; --copper:#a05a2c; --copper-soft:#f5ece3;
    --good:#2e6b4f; --good-soft:#e4f0ea; --danger:#a03a3a; --danger-soft:#f6e7e7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#14181d; --card:#1c2128; --ink:#e6e9ec; --ink-2:#aeb6bf; --ink-3:#8a929b;
      --line:#333b44; --cobalt:#7da3e8; --cobalt-soft:#21304a; --copper:#d08d5c; --copper-soft:#33281e;
      --good:#6fbb96; --good-soft:#1e3229; --danger:#d98a8a; --danger-soft:#3a2424; }
  }
  :root[data-theme="dark"] { --paper:#14181d; --card:#1c2128; --ink:#e6e9ec; --ink-2:#aeb6bf; --ink-3:#8a929b;
    --line:#333b44; --cobalt:#7da3e8; --cobalt-soft:#21304a; --copper:#d08d5c; --copper-soft:#33281e;
    --good:#6fbb96; --good-soft:#1e3229; --danger:#d98a8a; --danger-soft:#3a2424; }
  :root[data-theme="light"] { --paper:#f6f7f8; --card:#ffffff; --ink:#1b2129; --ink-2:#4a545f; --ink-3:#6e7883;
    --line:#d8dde2; --cobalt:#2c55a8; --cobalt-soft:#e8eef8; --copper:#a05a2c; --copper-soft:#f5ece3;
    --good:#2e6b4f; --good-soft:#e4f0ea; --danger:#a03a3a; --danger-soft:#f6e7e7; }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin:0; font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:14px; line-height:1.5; }
  button { font-family:var(--sans); cursor:pointer; }
  input, select, textarea { font-family:var(--sans); font-size:0.85rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:0.4rem 0.6rem; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--cobalt); outline-offset:1px; }
  a { color: var(--cobalt); }

  .topbar { display:flex; align-items:center; gap:1rem; padding:0.6rem 1.1rem; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:20; }
  .logo { font-weight:800; letter-spacing:0.08em; color:var(--cobalt); font-size:0.85rem; white-space:nowrap; }
  .ws-title { font-size:0.85rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .proto-badge { font-size:0.62rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--copper); border:1px solid var(--copper); border-radius:4px; padding:0.1rem 0.45rem; white-space:nowrap; }

  .layout { display:grid; grid-template-columns: 12.5rem 1fr; min-height: calc(100vh - 45px); }
  /* Three-pane workbench: the assistant rail is persistent across all views
     (spec section 4). It collapses to a launcher button rather than
     disappearing, so parity with the user is always one click away. */
  .layout.with-assistant { grid-template-columns: 12.5rem 1fr 23rem; }
  .arail { border-left:1px solid var(--line); background:var(--card); display:flex;
           flex-direction:column; min-height:0; position:sticky; top:45px;
           height:calc(100vh - 45px); }
  .arail-head { padding:0.55rem 0.7rem; border-bottom:1px solid var(--line);
                display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
  .arail-body { flex:1; overflow-y:auto; padding:0.7rem; min-height:0; }
  .arail-foot { border-top:1px solid var(--line); padding:0.55rem 0.7rem; }
  .arail-foot textarea { width:100%; resize:vertical; min-height:3.1rem; font:inherit;
                         font-size:0.8rem; padding:0.4rem 0.5rem; }
  .amsg { border-left:3px solid var(--line); padding:0.4rem 0 0.4rem 0.6rem; margin-bottom:0.6rem; font-size:0.82rem; }
  .amsg.user { border-left-color:var(--ink-3); }
  .amsg.bot  { border-left-color:var(--cobalt); }
  .amsg.err  { border-left-color:var(--danger); background:var(--danger-soft); }
  .amsg .who { font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-3); }
  /* Activity log: the user watches the assistant work with the same
     visibility they would have watching a colleague drive the interface. */
  .alog { font-family:ui-monospace,Menlo,monospace; font-size:0.68rem; color:var(--ink-2);
          background:var(--paper); border:1px solid var(--line); border-radius:5px;
          padding:0.3rem 0.45rem; margin:0.35rem 0; }
  .alog div { padding:0.06rem 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .alog .ok { color:var(--ink-2); }
  .alog .bad { color:var(--danger); }
  .achip { display:inline-block; font-size:0.64rem; padding:0.05rem 0.35rem; border-radius:999px;
           background:var(--paper); border:1px solid var(--line); color:var(--ink-2); }
  .achip.llm { border-color:var(--cobalt); color:var(--cobalt); }
  /* Pending assistant changes render IN PLACE, where the user will judge them
     — distinct from both the confidence dots and the conflict red. */
  .card-item.pending { background:#fffaf0; border-color:var(--copper); border-style:dashed; }
  .card-item.flash { animation: flashcard 1.4s ease-out; }
  @keyframes flashcard { 0%{box-shadow:0 0 0 3px var(--copper);} 100%{box-shadow:none;} }
  .pendbadge { display:inline-block; font-size:0.62rem; font-weight:700; letter-spacing:0.04em;
               text-transform:uppercase; padding:0.05rem 0.35rem; border-radius:3px;
               background:var(--copper); color:#fff; }
  .link-pending { border-bottom:1px dashed var(--copper); }
  .csdrawer { border-top:2px solid var(--copper); background:#fffaf0; max-height:15rem; overflow-y:auto; }
  .cshead { padding:0.4rem 0.6rem; font-size:0.76rem; display:flex; gap:0.4rem;
            align-items:baseline; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .csop { padding:0.3rem 0.6rem; font-size:0.74rem; cursor:pointer; display:flex; gap:0.4rem;
          align-items:flex-start; border-bottom:1px solid #f0e7d8; }
  .csop:hover { background:#fff3dd; }
  .csbtns { padding:0.45rem 0.6rem; display:flex; gap:0.4rem; flex-wrap:wrap; }
  .actor-chip { display:inline-block; font-size:0.62rem; padding:0.02rem 0.3rem; border-radius:3px;
                background:var(--paper); border:1px solid var(--line); color:var(--ink-3); }
  @media (max-width: 1100px) { .layout.with-assistant { grid-template-columns: 12.5rem 1fr; }
    .arail { position:fixed; right:0; top:45px; width:min(23rem,92vw); z-index:40;
             box-shadow:-8px 0 24px rgba(0,0,0,0.13); } }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .rail { display:flex; flex-wrap:wrap; border-right:none !important; border-bottom:1px solid var(--line); padding:0.4rem !important; } .rail .nav-head{display:none;} .rail .nav-item{border-radius:6px; border-right:none !important;} }
  .rail { border-right:1px solid var(--line); padding:0.9rem 0; background:var(--card); }
  .nav-item { display:flex; justify-content:space-between; gap:0.5rem; width:100%; text-align:left; background:none; border:none; color:var(--ink-2); font-size:0.82rem; padding:0.4rem 1.1rem; }
  .nav-item:hover { color:var(--cobalt); }
  .nav-item.active { background:var(--cobalt-soft); color:var(--cobalt); font-weight:700; border-right:2px solid var(--cobalt); }
  .nav-count { color:var(--ink-3); font-weight:400; font-variant-numeric:tabular-nums; }
  .nav-head { font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); padding:1rem 1.1rem 0.3rem; font-weight:700; }
  .nav-alert { color: var(--copper); }

  .main { padding:1.1rem 1.4rem 3rem; max-width:62rem; }
  .view-head { display:flex; align-items:center; justify-content:space-between; gap:0.8rem; flex-wrap:wrap; margin-bottom:0.9rem; }
  .view-title { font-size:1.05rem; font-weight:700; }
  .view-sub { font-size:0.78rem; color:var(--ink-3); margin:-0.5rem 0 0.9rem; max-width:46rem; }

  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink-2); border-radius:6px; padding:0.35rem 0.75rem; font-size:0.78rem; font-weight:600; }
  .btn:hover { border-color:var(--cobalt); color:var(--cobalt); }
  .btn.primary { background:var(--cobalt); border-color:var(--cobalt); color:var(--paper); }
  .btn.primary:hover { opacity:0.9; color:var(--paper); }
  .btn.danger { color:var(--danger); }
  .btn.small { padding:0.15rem 0.5rem; font-size:0.7rem; }

  .chips { display:flex; gap:0.35rem; flex-wrap:wrap; }
  .chip { font-size:0.7rem; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:0.18rem 0.65rem; color:var(--ink-2); }
  .chip.on { background:var(--cobalt); border-color:var(--cobalt); color:var(--paper); }

  .card-item { border:1px solid var(--line); border-radius:8px; padding:0.75rem 0.95rem; margin-bottom:0.7rem; background:var(--card); }
  .card-top { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem; flex-wrap:wrap; }
  .ctype { font-size:0.6rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-radius:4px; padding:0.14rem 0.5rem; }
  .ctype.fact { background:var(--cobalt-soft); color:var(--cobalt); }
  .ctype.opportunity { background:var(--good-soft); color:var(--good); }
  .ctype.tradeoff, .ctype.risk { background:var(--copper-soft); color:var(--copper); }
  .ctype.open_question, .ctype.assumption { background:var(--paper); color:var(--ink-2); border:1px dashed var(--ink-3); }
  .ctype.recommendation, .ctype.decision { background:var(--cobalt); color:var(--paper); }
  .ccode { font-family:var(--mono); font-size:0.68rem; color:var(--ink-3); }
  .conf-note { font-size:0.68rem; color:var(--ink-3); }
  .conf-note b { color:var(--ink-2); }
  .badge { font-size:0.62rem; font-weight:700; border-radius:4px; padding:0.1rem 0.4rem; }
  .badge.conflict { background:var(--danger-soft); color:var(--danger); }
  .badge.unsourced { background:var(--copper-soft); color:var(--copper); }
  .badge.runs { background:var(--good-soft); color:var(--good); }
  .badge.needs { background:var(--copper-soft); color:var(--copper); }
  .badge.manual { background:var(--paper); color:var(--ink-3); border:1px solid var(--line); }
  tr.run-hi > td { background:var(--cobalt-soft); transition:background 0.6s; }
  .card-body { font-size:0.86rem; line-height:1.45; }
  .card-detail { font-size:0.78rem; color:var(--ink-2); margin-top:0.3rem; }
  .card-meta { font-size:0.68rem; color:var(--ink-3); margin-top:0.45rem; display:flex; gap:0.9rem; flex-wrap:wrap; align-items:center; }
  .card-meta .src { color:var(--cobalt); }
  .tagpill { font-size:0.64rem; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:0.05rem 0.45rem; color:var(--ink-3); }

  table.grid { border-collapse:collapse; width:100%; font-size:0.8rem; background:var(--card); }
  .gridwrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin-bottom:1rem; }
  table.grid th { text-align:left; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); padding:0.55rem 0.75rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.grid td { padding:0.5rem 0.75rem; border-bottom:1px solid var(--line); vertical-align:top; color:var(--ink-2); }
  table.grid tr:last-child td { border-bottom:none; }

  .panel { border:1px solid var(--line); border-radius:8px; background:var(--card); padding:0.9rem 1.1rem; margin-bottom:1rem; }
  .panel h3 { margin:0 0 0.5rem; font-size:0.85rem; }
  .panel .hint { font-size:0.74rem; color:var(--ink-3); }
  .notice { border-left:3px solid var(--copper); background:var(--copper-soft); border-radius:0 6px 6px 0; padding:0.6rem 0.9rem; font-size:0.78rem; color:var(--ink-2); margin-bottom:1rem; }

  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); padding:0; max-width:38rem; width:92vw; max-height:88vh; }
  dialog::backdrop { background:rgba(0,0,0,0.35); }
  .dlg-head { display:flex; justify-content:space-between; align-items:center; padding:0.8rem 1.1rem; border-bottom:1px solid var(--line); font-weight:700; font-size:0.9rem; }
  .dlg-body { padding:1rem 1.1rem; overflow-y:auto; max-height:calc(88vh - 7rem); }
  .dlg-foot { display:flex; justify-content:flex-end; gap:0.5rem; padding:0.7rem 1.1rem; border-top:1px solid var(--line); }
  .frow { margin-bottom:0.7rem; }
  .frow label { display:block; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:0.2rem; }
  .frow input[type=text], .frow input[type=url], .frow input[type=date], .frow select, .frow textarea { width:100%; }
  .frow textarea { min-height:4rem; resize:vertical; }
  .frow .inline { display:flex; gap:0.5rem; }
  .charcount { font-size:0.65rem; color:var(--ink-3); text-align:right; }
  .subitem { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; font-size:0.75rem; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.6rem; margin-bottom:0.3rem; }

  .toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:0.78rem; padding:0.5rem 1rem; border-radius:6px; z-index:100; opacity:0; transition:opacity 0.2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .searchbox { min-width:12rem; flex:1; max-width:20rem; }
  .empty { color:var(--ink-3); font-size:0.8rem; padding:1rem 0; }
  .memo-preview { font-family:var(--mono); font-size:0.72rem; white-space:pre-wrap; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:1rem; max-height:24rem; overflow:auto; }
  .criteria-cov { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.4rem; font-size:0.8rem; }
  .covbar { flex:1; height:6px; background:var(--paper); border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .covbar > div { height:100%; background:var(--cobalt); }
  .hit { border-left:3px solid var(--cobalt); padding:0.4rem 0.8rem; margin-bottom:0.5rem; background:var(--cobalt-soft); border-radius:0 6px 6px 0; font-size:0.8rem; }
  .hit .where { font-size:0.65rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; }
  mark { background:var(--copper-soft); color:var(--copper); border-radius:2px; padding:0 2px; }

  /* Reference chips — one look for every card/source mention in the app */
  .ref { background:none; border:none; padding:0 0.05em; font:inherit; color:inherit; cursor:pointer;
         border-bottom:1px dotted var(--ink-3); line-height:1.3; }
  .ref:hover, .ref:focus-visible { color:var(--cobalt); border-bottom-color:var(--cobalt); }
  .ref-card { font-family:var(--mono); font-size:0.92em; white-space:nowrap; }
  .ref-dep { text-decoration:line-through; opacity:0.55; }
  .ref-broken { color:var(--danger); border-bottom:1px dotted var(--danger); cursor:help; font-family:var(--mono); font-size:0.92em; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:0.3em; vertical-align:baseline; }
  .dot-established { background:var(--good); }
  .dot-probable    { background:var(--ink-3); }
  .dot-contested   { background:var(--copper); }
  .dot-unverified  { background:var(--danger); }
  #tip { position:fixed; z-index:400; max-width:26rem; background:var(--card); color:var(--ink);
         border:1px solid var(--line); border-radius:7px; box-shadow:0 6px 22px rgba(0,0,0,0.20);
         padding:0.6rem 0.75rem; font-size:0.78rem; line-height:1.45; display:none; pointer-events:none; }
  #tip.show { display:block; }
  .btn.just { background:var(--cobalt-soft); border-color:var(--cobalt); color:var(--cobalt); font-weight:700; }
  .btn.just:hover { background:var(--cobalt); border-color:var(--cobalt); color:var(--paper); }
  .dlg-crumbs { padding:0.4rem 1.1rem; border-bottom:1px solid var(--line); background:var(--paper); font-size:0.75rem; }

  /* Evidence trace */
  .linklike { background:none; border:none; padding:0; font:inherit; color:var(--cobalt); text-decoration:underline; text-underline-offset:2px; }
  .linklike:hover { color:var(--ink); }
  dialog.trace { max-width:52rem; }
  .tsec { margin-top:1.2rem; }
  .tsec h4 { font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:0 0 0.5rem; padding-bottom:0.25rem; border-bottom:1px solid var(--line); }
  .tnode { border-left:2px solid var(--good); padding:0.4rem 0 0.4rem 0.7rem; margin:0.4rem 0; }
  .tnode .tnode { border-left-color:var(--copper); margin:0; padding-top:0; padding-bottom:0; }
  .tnode.against { border-left-color:var(--copper); padding:0; }
  .trel { font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); font-weight:700; }
  .tsrc { font-size:0.7rem; color:var(--ink-2); margin-top:0.25rem; }
  .tflag { color:var(--copper); }
</style>

<div class="topbar">
  <span class="logo">◆ LODESTONE</span>
  <span class="ws-title" id="wsTitle"></span>
  <span class="proto-badge">P1 Prototype</span>
</div>
<div class="layout" id="layout">
  <nav class="rail" id="rail" aria-label="Main navigation"></nav>
  <main class="main" id="main"></main>
  <aside class="arail" id="arail" aria-label="Assistant" hidden></aside>
</div>
<dialog id="dlg" aria-modal="true"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Evidence content, if present. Gitignored: the public repository ships the
     tool, not the analysis. Missing file = empty workspace, not an error. -->
<script src="seed.js"></script>
<script>
"use strict";
/* ============================================================
   LODESTONE P1 prototype — single-file, no external dependencies.
   Persistence: localStorage. Export: window.claude.downloads (fallback: clipboard).
   The LLM assistant of the spec (FR-A1/A2/A5) requires a deployed backend and is
   NOT simulated here; the Analyst view implements the deterministic audits
   (FR-A4) that need no model. See spec §3.
   ============================================================ */

const LS_KEY = "lodestone-p1-v1";
const TYPES = {
  fact:{label:"Fact", plural:"Facts", prefix:"F"},
  opportunity:{label:"Opportunity", plural:"Opportunities", prefix:"O"},
  tradeoff:{label:"Tradeoff", plural:"Tradeoffs", prefix:"T"},
  open_question:{label:"Open question", plural:"Open questions", prefix:"OQ"},
  risk:{label:"Risk", plural:"Risks", prefix:"R"},
  assumption:{label:"Assumption", plural:"Assumptions", prefix:"A"},
  recommendation:{label:"Recommendation", plural:"Recommendations", prefix:"REC"},
  decision:{label:"Decision", plural:"Decisions", prefix:"D"}
};
const CONF = ["established","probable","contested","unverified"];
const STATUSES = ["active","investigating","answered","deprecated"];
const RELS = ["supports","conflicts-with","answers","depends-on","informs"];
const NEEDS_SOURCE = ["fact","opportunity","tradeoff","risk","recommendation"];

/* Seed version. Bump whenever evidence is added to the seed below, and add a
   matching entry to SEED_ADDITIONS so workspaces already in localStorage pick
   the new evidence up without being reset (which would discard saved runs). */
const SEED_VERSION = 9;

/* Evidence added after the original seed, keyed by the version that introduced
   it. Kept as data so seedData() and the migration in load() share one
   definition rather than drifting apart. */
const SEED_ADDITIONS = {
  3: {
    // Verified 2026-08-07 against anl.gov/cse/electrochemical-chemical-TEA
    // (which anl.gov/cse/batpac-model-software now redirects to).
    modelPatches: [
      {id:"m3", fill:{
       version:"v5.1 — the newest version Argonne names, and only in the description of a tutorial video recorded 2023-11-13. The published manual still documents v5.0 (OSTI 1877590). No changelog or release history is given, so a newer build could exist unannounced.",
       obtain:"No public download. Argonne asks that you request a free copy by email — the partnerships page's \"Request BatPaC\" button points at ahmeds@anl.gov. Identity-gated, so it cannot be automated.",
       caveat:"The freely distributed BatPaC assumes stiff pouch cells. BatPaC-Cylindrical is a separate model available only through collaborative research projects, so 4680-class cylindrical formats are out of scope for the free tool."}}
    ]
  },
  4: {
    // m7, m8 and m12 became directly runnable on 2026-08-07: all three publish
    // open JSON APIs needing no credential, so they are no longer embed-only.
    modelPatches: [
      {id:"m7",
       set:{tier:"data connector — runnable in LODESTONE",
            what:"Demand and supply projections by mineral, scenario and case (Global Critical Minerals Outlook)"},
       ifEquals:{tier:"1 (embed/link) + data",
                 what:"Demand/supply projections by mineral and scenario"},
       fill:{obtain:"Open JSON API at api.iea.org — no key or account. The sign-in prompts on iea.org govern report PDFs, not this data.",
             caveat:"Values are the published outlook, not a live market feed; the vintage is stamped on every run (currently GCMO2026)."}},
      {id:"m8",
       set:{tier:"data connector — runnable in LODESTONE"},
       ifEquals:{tier:"1 (embed/link) + data"},

/* Adds any seed evidence introduced after the workspace's recorded version.
   Entities already present by id are left alone, so local edits survive; only
   genuinely new ones are appended. Returns the number of entities added. */
/* One table describing how each kind of seed addition merges. Both the
   collection step and the application step are driven from it, so adding a new
   kind of seeded entity means adding ONE line here — not remembering to touch
   two places. That omission is exactly what broke three times (models, then
   actors/settings, then journal): the merged object was assembled from a
   hand-written list, so a new key silently arrived as undefined and the
   migration ran clean while doing nothing. */
const SEED_MERGE = {
  sources:      { how: "byId",        into: "sources" },
  cards:        { how: "byId",        into: "cards"   },
  models:       { how: "byId",        into: "models"  },
  actors:       { how: "byId",        into: "actors"  },
  settings:     { how: "fillFields",  into: "settings" },
  journal:      { how: "ensureArray", into: "journal"  },
  modelPatches: { how: "patch",       into: "models"   },
};

function applySeedAdditions(target){
  let added = 0;
  const from = Number(target.seedVersion || 1) + 1;
  const clone = x => JSON.parse(JSON.stringify(x));

  for (let v = from; v <= SEED_VERSION; v++){
    // Tool-level additions (model metadata) ship in this file; evidence-level
    // additions come from the gitignored seed, if one is present.
    const pub = SEED_ADDITIONS[v] || {};
    const priv = ((typeof window !== "undefined" && window.LODESTONE_SEED && window.LODESTONE_SEED.additions) || {})[v] || {};

    // A key present in a seed entry but absent from SEED_MERGE would be
    // silently dropped — the precise bug this table exists to prevent. Say so.
    for (const key of new Set([...Object.keys(pub), ...Object.keys(priv)])) {
      if (!SEED_MERGE[key]) console.warn(`SEED_ADDITIONS[${v}] has unknown key "${key}" — add it to SEED_MERGE or it will be ignored.`);
    }

    for (const [key, rule] of Object.entries(SEED_MERGE)) {
      const a = pub[key], b = priv[key];
      if (a === undefined && b === undefined) continue;

      if (rule.how === "byId") {
        if (!target[rule.into]) target[rule.into] = [];
        for (const item of [...(a || []), ...(b || [])]) {
          if (!target[rule.into].some(x => x.id === item.id)) { target[rule.into].push(clone(item)); added++; }
        }
      }
      else if (rule.how === "fillFields") {
        // Fill only where absent, so a user's own choice is never reset.
        if (!target[rule.into]) target[rule.into] = {};
        for (const [k, val] of Object.entries({ ...(a || {}), ...(b || {}) })) {
          if (target[rule.into][k] === undefined) { target[rule.into][k] = val; added++; }
        }
      }
      else if (rule.how === "ensureArray") {
        if (!target[rule.into]) { target[rule.into] = []; added++; }
      }
      else if (rule.how === "patch") {
        // Two patch modes, both refusing to clobber a local edit:
        //   fill — only sets a field the workspace does not have at all
        //   set  — replaces a field, but only when it still holds the value
        //          named in ifEquals, so an analyst's own wording always wins
        for (const patch of [...(a || []), ...(b || [])]) {
          const m = (target[rule.into] || []).find(x => x.id === patch.id);
          if (!m) continue;
          for (const [k, val] of Object.entries(patch.fill || {})) {
            if (m[k] === undefined) { m[k] = val; added++; }
          }
          for (const [k, val] of Object.entries(patch.set || {})) {
            const expected = (patch.ifEquals || {})[k];
            if (m[k] === val) continue;
            if (expected === undefined || m[k] === expected) { m[k] = val; added++; }
          }
        }
      }
    }
  }
  target.seedVersion = SEED_VERSION;
  return added;
}

function uid(prefix){ db.seq += 1; return prefix + "-" + db.seq; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------- Actors (spec section 7) ----------------
   Every edit is credited to whoever made it, human or LLM, through one
   registry that is the canonical source of names for provenance. An LLM
   actor is a named configuration (a role plus a model), not a bare model
   string, which is how two LLM actors with different models coexist.
   Honest caveat: with no authentication the active human actor is declared,
   not verified — this is attribution, not identity. */
function actors(){ return db.actors || []; }
function actor(id){ return actors().find(a=>a.id===id); }
function activeActor(){ return actor(db.settings && db.settings.activeActor) || actors().find(a=>a.kind==="human") || null; }
function assistantActor(){ return actor(db.settings && db.settings.assistantActor) || actors().find(a=>a.kind==="llm") || null; }
function actorId(){ const a = activeActor(); return a ? a.id : "unknown"; }
// One renderer per referenceable entity — actors included, so a rename
// propagates everywhere and a dangling reference stays visible.
function actorRef(id){
  if(!id) return "";
  const a = actor(id);
  if(!a) return `<span class="ref ref-broken" data-tipmissing="${esc(id)}" tabindex="0">${esc(id)} ⚠</span>`;
  return `<span class="actor-chip" title="${esc(a.kind==="llm" ? (a.name+" · "+(a.model||"")) : a.name)}">${esc(a.name)}</span>`;
}
// Stamp attribution on a mutation. Cheap here because every edit already
// funnels through a small number of save paths; universal journaling of
// human edits follows in P3.
function stampCreate(o){ o.createdBy = actorId(); o.updatedBy = actorId(); return o; }
function stampUpdate(o){ o.updatedBy = actorId(); return o; }

/* P3 — universal journaling. The assistant's changes were already journaled;
   this closes the other half, so "every edit is credited to whoever makes it"
   holds for people too. Human edits are recorded as already-applied (they were
   never staged), which is what distinguishes them in the journal. */
function journalHuman(describe, targets){
  if(!db.journal) db.journal = [];
  db.journal.unshift({
    id: uid("cs"), task: describe, actor: actorId(), created: today(),
    status: "applied", approvedBy: actorId(), human: true,
    ops: [{ action: "ui", params: {}, targets: targets || {}, describe, status: "applied" }]
  });
  db.journal = db.journal.slice(0, 50);
}

/* ---------------- Derived ---------------- */
function effConfidence(c){
  if (NEEDS_SOURCE.includes(c.type) && c.citations.length===0) return "unverified";
  return c.confidence;
}
function hasConflict(c){
  if (c.links.some(l=>l.rel==="conflicts-with" && card(l.to) && card(l.to).status!=="deprecated")) return true;
  return db.cards.some(o=>o.id!==c.id && o.status!=="deprecated" && o.links.some(l=>l.rel==="conflicts-with" && l.to===c.id));
}
function needsSourcing(){ return db.cards.filter(c=>c.status!=="deprecated" && NEEDS_SOURCE.includes(c.type) && c.citations.length===0); }
function singleSource(){ return db.cards.filter(c=>c.status!=="deprecated" && c.type==="fact" && c.citations.length===1); }
function openConflicts(){
  const seen = new Set(), pairs = [];
  db.cards.forEach(c=>c.links.forEach(l=>{
    if(l.rel!=="conflicts-with") return;
    const o = card(l.to); if(!o) return;
    if(c.status==="deprecated"||o.status==="deprecated") return;
    const key = [c.id,o.id].sort().join("|");
    if(!seen.has(key)){ seen.add(key); pairs.push([c,o]); }
  }));
  return pairs;
}
function staleSources(){
  const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-13);
  return db.sources.filter(s=>{
    if(!(s.kind==="report"||s.kind==="dataset")) return false;
    const d = new Date(s.date.length===7 ? s.date+"-01" : s.date);
    return !isNaN(d) && d < cutoff;
  });
}
function citingCards(sourceId){ return db.cards.filter(c=>c.citations.some(x=>x.sourceId===sourceId)); }

function modelRun(id){
  // Server bindings win: a model becomes runnable by adding an entry to
  // model-bindings.mjs, with no client change. MODEL_RUN is only the
  // offline fallback used by the published artifact.
  if(serverCaps && serverCaps.params && serverCaps.params[id]){
    const adapter = (serverCaps.adapters||{})[id];
    return {
      mode: "live",
      adapter,
      note: adapter==="browser" ? "Driven headlessly in a real browser; this tool outputs charts, so any figure read from them is an estimate."
          : adapter==="recalc"  ? "Recalculated in Microsoft Excel — values are exact model output."
          : adapter==="read-only" ? "Read-only: cached values only, inputs cannot be recalculated without Excel."
          : adapter==="missing-file" ? "Workbook not found — see the reason below."
          : undefined,
      params: serverCaps.params[id],
    };
  }
  return MODEL_RUN[id] || { mode:"manual" };
}
function modelReason(id){ return (serverCaps && serverCaps.reason && serverCaps.reason[id]) || null; }

// Populated by a probe at start-up; stays null in the published artifact,
// which cannot reach a server — so the UI reports capability truthfully.
let serverCaps = null;
async function detectCaps(){
  try {
    const r = await fetch("api/capabilities", { cache:"no-store" });
    if(r.ok) serverCaps = await r.json();
  } catch(e) { serverCaps = null; }
  if(view === "models") render();
}

function modelBadge(id){
  const r = modelRun(id);
  const served = serverCaps && (serverCaps.run||[]).includes(id);
  if(!served) return r.mode === "manual"
    ? `<span class="badge manual">Manual capture</span>`
    : `<span class="badge needs">Runs only in the local deployment</span>`;
  if(!((serverCaps.ready||{})[id])) return `<span class="badge needs">${esc(modelReason(id) || "Not ready")}</span>`;
  const adapter = (serverCaps.adapters||{})[id];
  const how = adapter==="browser" ? "▶ Runs headlessly (charts)"
            : adapter==="recalc"  ? "▶ Runs in Excel (exact)"
            : "▶ LODESTONE can run this";
  return `<span class="badge runs">${esc(how)}</span>`;
}
function modelRunnableNow(id){
  if(!serverCaps) return false;
  if(!(serverCaps.run||[]).includes(id)) return false;
  return !!((serverCaps.ready||{})[id]);
}

   Every mention of a card or a source anywhere in the UI goes through these
   two functions, so linking, hover summaries, confidence dots, broken-
   reference handling, and click behaviour stay identical in every view.
   ========================================================================= */
function confDot(conf){ return `<span class="dot dot-${conf}" aria-hidden="true"></span>`; }

// Inline reference to a card. Click → its justification panel.
function cardRef(id, opts){
  opts = opts || {};
  const c = card(id);
  if(!c) return `<span class="ref ref-broken" data-tipmissing="${esc(id)}" tabindex="0">${esc(id)} ⚠</span>`;
  const label = opts.label || c.id;
  return `<button class="ref ref-card${c.status==="deprecated"?" ref-dep":""}" data-action="trace" data-id="${esc(c.id)}" data-tipcard="${esc(c.id)}" title="">${confDot(effConfidence(c))}${esc(label)}</button>`;
}

// Inline reference to a source. Click → its library entry (which offers the
// external link). Never links straight out: many sources are paywalled,
// URL-less, or captured model runs.
function sourceRef(sid, opts){
  opts = opts || {};
  const s = source(sid);
  if(!s) return `<span class="ref ref-broken" data-tipmissing="${esc(sid)}" tabindex="0">${esc(sid)} ⚠</span>`;
  const base = opts.full ? s.title : (s.author || s.title);
  return `<button class="ref ref-src" data-action="sourceDetail" data-id="${esc(s.id)}" data-tipsource="${esc(s.id)}">${esc(base)}${opts.locator?` — ${esc(opts.locator)}`:""}</button>`;
}

/* ---------------- Hover / focus summaries ---------------- */
let tipEl = null;
function tipNode(){
  if(!tipEl){ tipEl = document.createElement("div"); tipEl.id = "tip"; }
  // A modal <dialog> lives in the top layer; a tip parented to <body> would be
  // painted underneath it. Re-parent to whichever is showing.
  const host = (dlg && dlg.open) ? dlg : document.body;
  if(tipEl.parentNode !== host) host.appendChild(tipEl);
  return tipEl;
}
function tipHTML(el){
  if(el.dataset.tipcard){
    const c = card(el.dataset.tipcard); if(!c) return null;
    const conf = effConfidence(c);
    return `<div class="card-top" style="margin-bottom:0.3rem;">
        <span class="ctype ${esc(c.type)}">${TYPES[c.type].label}</span>
        <span class="ccode">${esc(c.id)}</span>
        <span class="conf-note">${confDot(conf)}${esc(conf)}${c.status!=="active"?` · ${esc(c.status)}`:""} · ${c.citations.length} source${c.citations.length===1?"":"s"}</span>
      </div>
      <div>${esc(c.statement)}</div>
      <div class="conf-note" style="margin-top:0.35rem;">Click for its justification</div>`;
  }
  if(el.dataset.tipsource){
    const s = source(el.dataset.tipsource); if(!s) return null;
    const n = citingCards(s.id).length;
    const stale = staleSources().some(x=>x.id===s.id);
    return `<div><b>${esc(s.title)}</b></div>
      <div class="conf-note">${esc(s.author)} · ${esc(s.date)} · ${esc(s.kind)} · ${esc(s.access)}${stale?` · <span class="tflag">possibly superseded</span>`:""}</div>
      ${s.notes?`<div style="margin-top:0.3rem;">${esc(s.notes)}</div>`:""}
      <div class="conf-note" style="margin-top:0.35rem;">Cited by ${n} card${n===1?"":"s"} · click for the library entry</div>`;
  }
  if(el.dataset.tipmissing){
    return `<div class="tflag"><b>${esc(el.dataset.tipmissing)}</b> is not in this workspace.</div>
      <div class="conf-note" style="margin-top:0.3rem;">The reference does not resolve — it may have been deleted, or the citation may be mistaken.</div>`;
  }
  return null;
}
const TIP_SEL = "[data-tipcard],[data-tipsource],[data-tipmissing]";
function showTip(el){
  const html = tipHTML(el); if(!html) return;
  const t = tipNode(); t.innerHTML = html; t.classList.add("show");
  const r = el.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - t.offsetWidth - 8));
  let top = r.bottom + 6;
  if(top + t.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - t.offsetHeight - 6);
  t.style.left = left + "px"; t.style.top = top + "px";
}
function hideTip(){ if(tipEl) tipEl.classList.remove("show"); }
document.addEventListener("mouseover", ev=>{ const el = ev.target.closest(TIP_SEL); if(el) showTip(el); });
document.addEventListener("mouseout",  ev=>{ if(ev.target.closest(TIP_SEL)) hideTip(); });
document.addEventListener("focusin",   ev=>{ const el = ev.target.closest(TIP_SEL); if(el) showTip(el); });
document.addEventListener("focusout",  hideTip);
window.addEventListener("scroll", hideTip, true);

/* ---------------- Source detail (the target of every source reference) ---- */
function sourceHTML(sid){
  const s = source(sid);
  if(!s) return `<div class="dlg-body">Source not found.</div>`;
  const cards = citingCards(s.id);
  const stale = staleSources().some(x=>x.id===s.id);
  return `
  <div class="dlg-head"><span>Source — ${esc(s.author||s.title)}</span><button class="btn small" data-action="closeDlg">✕</button></div>
  <div class="dlg-body">
    <h3 style="margin:0 0 0.3rem; font-size:1rem;">${esc(s.title)}</h3>
    <div class="conf-note">${esc(s.author)} · ${esc(s.date)} · ${esc(s.kind)} · access: ${esc(s.access)}${stale?` · <span class="tflag">over 13 months old — check for a newer edition</span>`:""}</div>
    ${s.notes?`<p style="margin:0.7rem 0 0; font-size:0.85rem;">${esc(s.notes)}</p>`:""}
    ${s.url?`<p style="margin:0.7rem 0 0;"><a href="${esc(s.url)}" target="_blank" rel="noopener">Open the document in a new window ↗</a>${s.access!=="open"?` <span class="conf-note">(${esc(s.access)} — you may hit a login wall)</span>`:""}</p>`
          :`<p class="conf-note" style="margin:0.7rem 0 0;">No URL recorded for this source.</p>`}
    <div class="tsec"><h4>Cited by ${cards.length} card${cards.length===1?"":"s"}</h4>
      ${cards.length? cards.map(c=>{
          const loc = (c.citations.find(x=>x.sourceId===s.id)||{}).locator;
          return `<div class="subitem"><span>${cardRef(c.id)} ${esc(c.statement)}${loc?` <span class="conf-note">— ${esc(loc)}</span>`:""}</span></div>`;
        }).join("") : `<div class="empty">No card cites this source yet.</div>`}
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-action="editSource" data-id="${esc(s.id)}" style="margin-right:auto;">Edit this source</button>
    <button class="btn primary" data-action="closeDlg">Close</button>
  </div>`;
}
function openSource(sid){ openDlg(sourceHTML(sid)); }

/* ---------------- Evidence trace (FR-C3/C4 audit for a single claim) ----------
   Walks the typed link graph beneath a card to assemble the case FOR it, the
   case AGAINST it, and the sources both rest on. Supporting relations:
   the card "rests on" what it depends-on; other cards "support"/"inform"/
   "answer" it. Opposing: anything conflicting with a node, plus risks and
   unresolved open questions attached to any node.                          */
const MAX_TRACE_DEPTH = 5;
function traceGraph(rootId){
  const inCase = new Set([rootId]);
  const tree = [];
  (function walk(id, depth){
    if(depth >= MAX_TRACE_DEPTH) return;
    const c = card(id); if(!c) return;
    const kids = [];
    (c.links||[]).forEach(l=>{
      const o = card(l.to);
      if(o && o.status!=="deprecated" && l.rel==="depends-on") kids.push({id:l.to, rel:"rests on"});
    });
    db.cards.forEach(o=>{
      if(o.status==="deprecated" || o.id===id) return;
      (o.links||[]).forEach(l=>{
        if(l.to!==id) return;
        if(l.rel==="supports") kids.push({id:o.id, rel:"supports"});
        else if(l.rel==="informs") kids.push({id:o.id, rel:"informs"});
        else if(l.rel==="answers") kids.push({id:o.id, rel:"answers"});
      });
    });
    kids.forEach(k=>{
      if(inCase.has(k.id)) return;
      inCase.add(k.id);
      tree.push({id:k.id, parent:id, depth, rel:k.rel});
      walk(k.id, depth+1);
    });
  })(rootId, 0);

  const against = [], seenAg = new Set();
  const addAg = (id, why) => {
    if(inCase.has(id) || seenAg.has(id)) return;
    const o = card(id);
    if(!o || o.status==="deprecated") return;
    seenAg.add(id); against.push({id, why});
  };
  inCase.forEach(id=>{
    const c = card(id); if(!c) return;
    (c.links||[]).forEach(l=>{
      const o = card(l.to); if(!o) return;
      if(l.rel==="conflicts-with") addAg(o.id, `contradicts ${id}`);
      else if(o.type==="risk") addAg(o.id, `risk on ${id}`);
      else if(o.type==="open_question" && o.status!=="answered") addAg(o.id, `open question from ${id}`);
    });
    db.cards.forEach(o=>{
      (o.links||[]).forEach(l=>{
        if(l.to!==id) return;
        if(l.rel==="conflicts-with") addAg(o.id, `contradicts ${id}`);
        else if(o.type==="risk") addAg(o.id, `risk on ${id}`);
        else if(o.type==="open_question" && o.status!=="answered") addAg(o.id, `open question on ${id}`);
      });
    });
  });

  // Weak points inside the case itself (why the case might not hold).
  const stale = new Set(staleSources().map(s=>s.id));
  const weak = [];
  inCase.forEach(id=>{
    const c = card(id); if(!c) return;
    const conf = effConfidence(c);
    // Severity rank orders the list: load-bearing uncertainties first.
    if(c.type==="assumption") weak.push({id, rank:0, msg:"is an assumption, not an observation — the whole case inherits it."});
    if(conf==="unverified") weak.push({id, rank:1, msg:"is unverified — no citation backs it."});
    else if(conf==="contested") weak.push({id, rank:2, msg:"is contested — credible sources disagree."});
    if(c.type==="fact" && c.citations.length===1) weak.push({id, rank:3, msg:"rests on a single source."});
    c.citations.forEach(x=>{ if(stale.has(x.sourceId)){ const s=source(x.sourceId); weak.push({id, rank:4, msg:`cites ${s?s.title:x.sourceId} (${s?s.date:"?"}) — check for a newer edition.`}); } });
  });
  weak.sort((a,b)=>a.rank-b.rank);

  // Sources across the whole case, with the cards and locators using each.
  const srcMap = new Map();
  inCase.forEach(id=>{
    const c = card(id); if(!c) return;
    c.citations.forEach(x=>{
      if(!source(x.sourceId)) return;
      if(!srcMap.has(x.sourceId)) srcMap.set(x.sourceId, []);
      srcMap.get(x.sourceId).push({cardId:id, locator:x.locator});
    });
  });

  return { tree, against, weak, sources:[...srcMap.entries()], caseSize:inCase.size };
}

/* Inverse trace — the blast radius. Walks the same relations upward to answer
   "if this card is wrong, what else falls over?" For an assumption or a
   single-source fact this is usually the decision-relevant direction.       */
function inverseGraph(rootId){
  const seen = new Set([rootId]);
  const tree = [];
  (function walk(id, depth){
    if(depth >= MAX_TRACE_DEPTH) return;
    const c = card(id); if(!c) return;
    const parents = [];
    db.cards.forEach(o=>{
      if(o.status==="deprecated" || o.id===id) return;
      (o.links||[]).forEach(l=>{ if(l.to===id && l.rel==="depends-on") parents.push({id:o.id, rel:"rests on this"}); });
    });
    (c.links||[]).forEach(l=>{
      const o = card(l.to); if(!o || o.status==="deprecated") return;
      if(l.rel==="supports") parents.push({id:o.id, rel:"this supports"});
      else if(l.rel==="informs") parents.push({id:o.id, rel:"this informs"});
      else if(l.rel==="answers") parents.push({id:o.id, rel:"this answers"});
    });
    parents.forEach(p=>{
      if(seen.has(p.id)) return;
      seen.add(p.id); tree.push({id:p.id, depth, rel:p.rel});
      walk(p.id, depth+1);
    });
  })(rootId, 0);
  return tree;
}

/* Graph health — the justification panels are only as good as the links, so
   absence of links is itself a defect worth surfacing. */
function graphHealth(){
  const active = db.cards.filter(c=>c.status!=="deprecated");
  const referenced = new Set();
  active.forEach(c=>(c.links||[]).forEach(l=>referenced.add(l.to)));
  return {
    orphans: active.filter(c=>!(c.links||[]).length && !referenced.has(c.id)),
    unjustified: active.filter(c=>(c.type==="recommendation"||c.type==="decision") && traceGraph(c.id).tree.length===0),
    inert: active.filter(c=>c.type==="assumption" && inverseGraph(c.id).length===0),
    conflicts: openConflicts()
  };
}

const CASE_FOR_HEADING = {
  fact:"Why believe this", opportunity:"Why this counts as an opportunity",
  tradeoff:"What establishes this tradeoff", open_question:"What makes this question live",
  risk:"Why this risk is credible", assumption:"What this assumption rests on",
  recommendation:"Why do this", decision:"Why this decision"
};

function traceCardLine(c, rel, depth){
  const conf = effConfidence(c);
  const cites = c.citations.map(x=>sourceRef(x.sourceId, {locator:x.locator})).filter(Boolean);
  return `<div class="tnode" style="margin-left:${depth*1.1}rem;">
    <div class="card-top" style="margin-bottom:0.2rem;">
      ${rel?`<span class="trel">${esc(rel)}</span>`:""}
      <span class="ctype ${esc(c.type)}">${TYPES[c.type].label}</span>
      ${cardRef(c.id)}
      <span class="conf-note">${esc(conf)}${c.citations.length?` · ${c.citations.length} source${c.citations.length===1?"":"s"}`:" · no source"}</span>
    </div>
    <div style="font-size:0.83rem;">${esc(c.statement)}</div>
    ${cites.length?`<div class="tsrc">↳ ${cites.join(" · ")}</div>`:`<div class="tsrc tflag">↳ no citation</div>`}
  </div>`;
}

function traceHTML(rootId){
  const root = card(rootId);
  if(!root) return `<div class="dlg-body">Card not found.</div>`;
  const g = traceGraph(rootId);
  const forHTML = g.tree.length
    ? g.tree.map(n=>traceCardLine(card(n.id), n.rel, n.depth+1)).join("")
    : `<div class="empty">No supporting cards are linked yet. Link cards with <b>supports</b>, <b>informs</b>, or <b>depends-on</b> (Edit → Links) to build the case.</div>`;
  const againstHTML = g.against.length
    ? g.against.map(a=>`<div class="tnode against">${traceCardLine(card(a.id), a.why, 0)}</div>`).join("")
    : `<div class="empty">Nothing on the board currently contradicts or qualifies this case.</div>`;
  const weakHTML = g.weak.length
    ? `<ul style="margin:0; padding-left:1.1rem; font-size:0.79rem; color:var(--ink-2);">${g.weak.map(w=>`<li style="margin-bottom:0.25rem;">${cardRef(w.id)} ${esc(w.msg)}</li>`).join("")}</ul>`
    : `<div class="empty">No weak points detected in the supporting chain.</div>`;
  const srcHTML = g.sources.length
    ? g.sources.map(([sid, uses])=>{ const s=source(sid);
        return `<div class="subitem" style="align-items:flex-start;">
          <span>${sourceRef(sid, {full:true})}<br><span class="conf-note">${esc(s.author)} · ${esc(s.date)} · ${esc(s.access)}</span><br>
          <span style="color:var(--ink-2);">cited by ${uses.map(u=>`${cardRef(u.cardId)}${u.locator?` <span class="conf-note">(${esc(u.locator)})</span>`:""}`).join(", ")}</span></span>
        </div>`; }).join("")
    : `<div class="empty">No sources are cited anywhere in this case.</div>`;

  const inv = inverseGraph(rootId);
  const invHTML = inv.length
    ? inv.map(n=>traceCardLine(card(n.id), n.rel, n.depth)).join("")
    : `<div class="empty">Nothing on the board depends on this card, so being wrong about it would not directly invalidate anything else recorded here.</div>`;
  const crumbs = traceStack.length > 1
    ? `<div class="dlg-crumbs">${traceStack.map((id,i)=> i===traceStack.length-1
        ? `<span class="ccode">${esc(id)}</span>`
        : `<button class="ref ref-card" data-action="traceCrumb" data-i="${i}">${esc(id)}</button> <span class="conf-note">›</span>`).join(" ")}</div>`
    : "";
  const linkOpts = db.cards.filter(o=>o.id!==rootId && o.status!=="deprecated")
    .map(o=>`<option value="${esc(o.id)}">${esc(o.id)} — ${esc(o.statement.slice(0,60))}</option>`).join("");

  return `
  <div class="dlg-head">
    <span>Justification — ${esc(root.id)}</span>
    <span>${traceStack.length>1?`<button class="btn small" data-action="traceBack">← Back</button> `:""}<button class="btn small" data-action="closeDlg">✕</button></span>
  </div>
  ${crumbs}
  <div class="dlg-body">
    <div class="card-item" style="margin-bottom:0.9rem;">
      <div class="card-top">
        <span class="ctype ${esc(root.type)}">${TYPES[root.type].label}</span>
        <span class="ccode">${esc(root.id)}</span>
        <span class="conf-note">${confDot(effConfidence(root))}Confidence: <b>${esc(effConfidence(root))}</b>${root.status!=="active"?` · status: <b>${esc(root.status)}</b>`:""} · ${root.citations.length} source${root.citations.length===1?"":"s"}</span>
        ${hasConflict(root)?`<span class="badge conflict">⚠ conflict open</span>`:""}
      </div>
      <div class="card-body">${esc(root.statement)}</div>
      ${root.detail?`<div class="card-detail">${esc(root.detail)}</div>`:""}
      <div class="card-meta">
        ${root.tags.length?`<span>${root.tags.map(t=>`<span class="tagpill">${esc(t)}</span>`).join(" ")}</span>`:""}
        ${(root.links||[]).length?`<span>links: ${root.links.map(l=>`${esc(l.rel)} ${cardRef(l.to)}`).join(", ")}</span>`:""}
        <button class="btn small" data-action="showOnBoard" data-id="${esc(root.id)}">Show this card on the board ↗</button>
      </div>
    </div>
    <p class="hint" style="margin-top:0;">From the link graph: ${g.caseSize - 1} supporting card(s), ${g.against.length} challenge(s), ${inv.length} card(s) downstream, ${g.sources.length} source(s).</p>

    <div class="tsec"><h4>${esc(CASE_FOR_HEADING[root.type] || "The case for")}</h4>${forHTML}</div>
    <div class="tsec"><h4>The case against &amp; open challenges</h4>${againstHTML}</div>
    <div class="tsec"><h4>Weakest links in this case</h4>${weakHTML}</div>
    <div class="tsec"><h4>If this is wrong, what breaks</h4>${invHTML}</div>
    <div class="tsec"><h4>Sources this case rests on</h4>${srcHTML}</div>
    <div class="tsec"><h4>Link this card</h4>
      <div style="display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;">
        <span class="ccode">${esc(root.id)}</span>
        <select id="lk-rel">${RELS.map(r=>`<option${r==="depends-on"?" selected":""}>${r}</option>`).join("")}</select>
        <select id="lk-to" style="flex:1; min-width:12rem;">${linkOpts}</select>
        <button class="btn" data-action="addLinkFromTrace" data-id="${esc(root.id)}">Add link</button>
      </div>
      <p class="hint" style="margin:0.4rem 0 0;">A trace is only as complete as the links. Use <b>depends-on</b> when this card rests on another; <b>supports</b> or <b>informs</b> when it feeds another; <b>conflicts-with</b> to record a disagreement.</p>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-action="editCard" data-id="${esc(root.id)}" style="margin-right:auto;">Edit this card</button>
    <button class="btn primary" data-action="closeDlg">Close</button>
  </div>`;
}
let traceStack = [];
function openTrace(id){
  if(dlg.open && dlg.classList.contains("trace")){
    if(traceStack[traceStack.length-1] !== id) traceStack.push(id);
  } else {
    traceStack = [id];
  }
  hideTip();
  openDlg(traceHTML(id)); dlg.classList.add("trace");
}
function traceGoto(i){ traceStack = traceStack.slice(0, i+1); openDlg(traceHTML(traceStack[i])); dlg.classList.add("trace"); }
function traceBack(){
  traceStack.pop();
  const prev = traceStack[traceStack.length-1];
  if(prev){ openDlg(traceHTML(prev)); dlg.classList.add("trace"); } else closeDlg();
}

/* ---------------- Rendering ---------------- */
function render(){
  document.getElementById("wsTitle").textContent = "Workspace: " + db.ws.title;
  renderRail();
  const main = document.getElementById("main");
  if(view==="board") main.innerHTML = viewBoard();
  else if(view==="library") main.innerHTML = viewLibrary();
  else if(view==="models"){ main.innerHTML = viewModels(); if(highlightRunId) requestAnimationFrame(flashRun); }
  else if(view==="analyst") main.innerHTML = viewAnalyst();
  else if(view==="brief") main.innerHTML = viewBrief();
  else if(view==="settings") main.innerHTML = viewSettings();
  // The assistant rail is defined in assistant.js, which is only served by the
  // local deployment. Absent (published artifact), the layout stays two-pane.
  if(typeof renderAssistant === "function") renderAssistant();
}
function renderRail(){
  const counts = {};
  Object.keys(TYPES).forEach(t=>counts[t]=db.cards.filter(c=>c.type===t && c.status!=="deprecated").length);
  const total = db.cards.filter(c=>c.status!=="deprecated").length;
  const ns = needsSourcing().length, oc = openConflicts().length, st = staleSources().length;
  const item = (v,label,count,extra)=>`<button class="nav-item ${view===v&&(!extra||filters.type===extra)?"active":""}" data-action="nav" data-view="${v}" ${extra?`data-type="${extra}"`:""}><span>${label}</span><span class="nav-count">${count!=null?count:""}</span></button>`;
  document.getElementById("rail").innerHTML =
    item("board","Evidence board",total) +
    item("library","Reading library",db.sources.length) +
    item("models","Models & runs",db.runs.length) +
    item("analyst","Audits & health","") +
    item("brief","Brief & export","") +
    `<div class="nav-head">Card types</div>` +
    Object.keys(TYPES).map(t=>`<button class="nav-item" data-action="navtype" data-type="${t}"><span>${TYPES[t].plural}</span><span class="nav-count">${counts[t]}</span></button>`).join("") +
    `<div class="nav-head">Alerts</div>` +
    `<button class="nav-item" data-action="navaudit" data-audit="needs"><span class="${ns?"nav-alert":""}">Needs sourcing</span><span class="nav-count">${ns}</span></button>` +
    `<button class="nav-item" data-action="navaudit" data-audit="conflicts"><span class="${oc?"nav-alert":""}">Open conflicts</span><span class="nav-count">${oc}</span></button>` +
    `<button class="nav-item" data-action="navaudit" data-audit="stale"><span class="${st?"nav-alert":""}">Stale sources</span><span class="nav-count">${st}</span></button>` +
    `<div class="nav-head">Workspace</div>` +
    item("settings","Settings & data","");
}

function cardHTML(c, opts){
  opts = opts||{};
  const conf = effConfidence(c);
  const cites = c.citations.map(x=>sourceRef(x.sourceId, {locator:x.locator}));
  const links = c.links.map(l=>`${esc(l.rel)} ${cardRef(l.to)}`);
  const unsourced = NEEDS_SOURCE.includes(c.type) && c.citations.length===0;
  // In-situ review: a card the assistant just created or changed renders
  // marked, in place, so it is judged where it will live.
  const pend = (typeof isPending==="function") && isPending("card", c.id);
  return `<article class="card-item${pend?" pending":""}" data-cid="${esc(c.id)}">
    <div class="card-top">
      <span class="ctype ${esc(c.type)}">${TYPES[c.type].label}</span>
      <span class="ccode">${esc(c.id)}</span>
      ${pend?`<span class="pendbadge">pending</span> `:""}<span class="conf-note">Confidence: <b>${esc(conf)}</b>${c.status!=="active"?` · status: <b>${esc(c.status)}</b>`:""} · <button class="linklike conf-note" data-action="trace" data-id="${esc(c.id)}" title="Show the sources and the reasoning behind this card">${c.citations.length} source${c.citations.length===1?"":"s"}</button></span>
      ${hasConflict(c)?`<span class="badge conflict">⚠ conflict open</span>`:""}
      ${unsourced?`<span class="badge unsourced">needs sourcing</span>`:""}
    </div>
    <div class="card-body">${esc(c.statement)}</div>
    ${c.detail?`<div class="card-detail">${esc(c.detail)}</div>`:""}
    <div class="card-meta">
      ${cites.length?`<span class="src">${cites.join(" · ")}</span>`:""}
      ${links.length?`<span>links: ${links.join(", ")}</span>`:""}
      ${c.tags.length?`<span>${c.tags.map(t=>`<span class="tagpill">${esc(t)}</span>`).join(" ")}</span>`:""}
      ${opts.noEdit?"":`<button class="btn small just" data-action="trace" data-id="${esc(c.id)}">Justification</button>
      ${typeof renderAssistant==="function"?`<button class="btn small" data-action="aJustify" data-id="${esc(c.id)}" title="Have the assistant build this card's justification: find support, record conflicts, cite sources">⚡ Justify</button>`:""}
      <button class="btn small" data-action="editCard" data-id="${esc(c.id)}">Edit</button>`}
    </div>
  </article>`;
}

function viewBoard(){
  let cards = db.cards.filter(c=>c.status!=="deprecated");
  if(filters.type!=="all") cards = cards.filter(c=>c.type===filters.type);
  if(filters.tag) cards = cards.filter(c=>c.tags.includes(filters.tag));
  if(filters.q){
    const q = filters.q.toLowerCase();
    cards = cards.filter(c=>(c.statement+" "+c.detail+" "+c.tags.join(" ")+" "+c.id).toLowerCase().includes(q));
  }
  const allTags = [...new Set(db.cards.flatMap(c=>c.tags))].sort();
  return `
  <div class="view-head">
    <span class="view-title">Evidence board</span>
    <input class="searchbox" type="text" id="boardQ" value="${esc(filters.q)}" placeholder="Filter cards…" aria-label="Filter cards">
    ${typeof renderAssistant==="function"?`<button class="btn" data-action="aConclude" title="Have the assistant form a recommendation for the decision question and justify it">⚡ Form a conclusion</button>`:""}
      <button class="btn primary" data-action="newCard">+ New card</button>
  </div>
  <div class="chips" style="margin-bottom:0.5rem;">
    <button class="chip ${filters.type==="all"?"on":""}" data-action="ftype" data-type="all">All</button>
    ${Object.keys(TYPES).map(t=>`<button class="chip ${filters.type===t?"on":""}" data-action="ftype" data-type="${t}">${TYPES[t].plural}</button>`).join("")}
  </div>
  <div class="chips" style="margin-bottom:0.9rem;">
    ${allTags.map(t=>`<button class="chip ${filters.tag===t?"on":""}" data-action="ftag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
  </div>
  ${cards.length? cards.map(c=>cardHTML(c)).join("") : `<div class="empty">No cards match the current filters.</div>`}`;
}

    return `<tr>
      <td>${sourceRef(s.id,{full:true})}${stale?` <span class="badge unsourced" title="Over 13 months old — check for a newer edition">stale?</span>`:""}<br><span style="font-size:0.68rem;color:var(--ink-3);">${esc(s.author)} · ${esc(s.date)} · ${esc(s.kind)} · ${esc(s.access)}</span>${s.notes?`<br><span style="font-size:0.7rem;">${esc(s.notes)}</span>`:""}</td>
      <td>${n? citingCards(s.id).map(c=>cardRef(c.id)).join(" ") : `<span class="conf-note">none</span>`}</td>
      <td style="white-space:nowrap;">
        ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">open ↗</a><br>`:""}
        <button class="btn small" data-action="editSource" data-id="${esc(s.id)}">Edit</button>
        <button class="btn small danger" data-action="delSource" data-id="${esc(s.id)}" ${n?"disabled title='Cited by cards — cannot delete'":""}>Delete</button>

          <button class="btn small" data-action="listMove" data-list="${esc(l.id)}" data-i="${i}" data-dir="-1" ${i===0?"disabled":""}>↑</button>
          <button class="btn small" data-action="listMove" data-list="${esc(l.id)}" data-i="${i}" data-dir="1" ${i===l.items.length-1?"disabled":""}>↓</button>
          <button class="btn small danger" data-action="listRemove" data-list="${esc(l.id)}" data-i="${i}">remove</button></li>`; }).join("")}
      </ol>
      <div class="inline" style="display:flex;gap:0.5rem;">
        <select id="addTo-${esc(l.id)}" aria-label="Add source to list">${db.sources.filter(s=>!l.items.some(it=>it.sourceId===s.id)).map(s=>`<option value="${esc(s.id)}">${esc(s.title.slice(0,60))}</option>`).join("")}</select>

  </div>
  <p class="view-sub">In the full build (FR-L1/L2), ingest fetches metadata and full text and the assistant proposes cards. In this prototype, sources are cataloged manually; “stale?” flags reports/datasets over 13 months old (FR-L4, simplified).</p>
  <div class="gridwrap"><table class="grid" aria-label="Sources"><thead><tr><th>Source</th><th>Cited by</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3 style="font-size:0.95rem;">Reading lists</h3>
  ${listsHTML || `<div class="empty">No reading lists yet.</div>`}`;
}

      <td>${esc(r.name)}<br><span style="font-size:0.68rem;color:var(--ink-3);">${esc(m?m.name:"?")} · ${esc(r.date)} · ${esc(r.runner||"user")}</span></td>
      <td style="font-size:0.72rem;"><b>Params:</b> ${esc(r.params)}<br><b>Outputs:</b> ${esc(r.outputs)}${r.notes?`<br><b>Notes:</b> ${esc(r.notes)}`:""}</td>
      <td style="white-space:nowrap;">
        ${r.result?`<button class="btn small just" data-action="viewRun" data-id="${esc(r.id)}">View result</button><br>`:""}
        ${r.sourceId?`<span style="font-size:0.68rem;color:var(--good);">✓ in library</span>`:`<button class="btn small" data-action="promoteRun" data-id="${esc(r.id)}">Save to library</button>`}<br>
        <button class="btn small danger" data-action="delRun" data-id="${esc(r.id)}">Delete</button>

    const r = modelRun(m.id);
    const n = runsFor(m.id);
    return `<div class="card-item">
      <div class="card-top">
        ${modelBadge(m.id)}
        <span style="font-weight:700;">${esc(m.name)}</span>
        <span class="conf-note">${esc(m.pub)}</span>
        ${n?`<span class="conf-note">· ${n} recorded run${n===1?"":"s"}</span>`:""}
      </div>
      <div class="card-body" style="font-size:0.84rem;">${esc(m.what)}</div>
      <div class="card-detail">${esc(m.tier)}${r.note?` — ${esc(r.note)}`:""}</div>
      ${m.version?`<div class="card-detail"><b>Version:</b> ${esc(m.version)}</div>`:""}
      ${m.obtain?`<div class="card-detail"><b>How to obtain:</b> ${esc(m.obtain)}</div>`:""}
      ${m.caveat?`<div class="card-detail"><b>Scope limit:</b> ${esc(m.caveat)}</div>`:""}
      <div class="card-meta">
        <a href="${esc(m.url)}" target="_blank" rel="noopener">Open the tool ↗</a>
        ${modelRunnableNow(m.id)?`<button class="btn small just" data-action="runNow" data-id="${esc(m.id)}">▶ Run it here</button>`:""}
        ${!modelRunnableNow(m.id) && (r.mode!=="manual" || (serverCaps&&(serverCaps.run||[]).includes(m.id)))?`<span class="conf-note">${serverCaps?esc(modelReason(m.id)||"Not ready"):"Start the local server (npm start) to enable"}</span>`:""}

  <div class="view-head"><span class="view-title">Models &amp; runs</span></div>

  <h3 style="font-size:0.95rem; margin:0 0 0.5rem;">Recorded runs (${db.runs.length})</h3>
  <p class="view-sub" style="margin-top:0;">Every run — executed here or recorded by hand — is kept with its parameters, outputs, and provenance, newest first. <b>Save to library</b> makes a run citable from any card; <b>View result</b> reopens the full table.</p>
  ${db.runs.length?`<div class="gridwrap"><table class="grid"><thead><tr><th>Run</th><th>Record</th><th>Actions</th></tr></thead><tbody>${runRows}</tbody></table></div>`
    :`<div class="empty">No runs yet. Run a model below, or record one you ran elsewhere.</div>`}

  <h3 style="font-size:0.95rem; margin:1.6rem 0 0.4rem;">Registered models (${db.models.length})</h3>
  <p class="view-sub" style="margin-top:0;">${live} of ${db.models.length} have a callable interface LODESTONE can drive directly; the rest are Excel workbooks, proprietary runtimes, or interactive apps with no API, so they use guided-manual capture — you run them, LODESTONE records the parameters, outputs, and provenance so the run stays citable.</p>
  ${cards}`;
}


/* P3 — parity + provenance panels. Both are deterministic. */
function parityPanelHTML(){
  if(typeof parityAudit !== "function")
    return `<div class="panel"><h3>Interface parity</h3><p class="hint">Requires the local deployment (the assistant module defines the action registry).</p></div>`;
  const r = parityAudit();
  const gapRows = r.gaps.map(g=>`<li><code>${esc(g.action)}</code> — ${esc(g.why)}</li>`).join("");
  return `<div class="panel">
    <h3>Interface parity ${r.pass?`<span class="badge runs">passing</span>`:`<span class="badge needs">${r.gaps.length} gap${r.gaps.length===1?"":"s"}</span>`}</h3>
    <p class="hint">Design principle 7: the assistant can do anything the user can do through the interface. A capability withheld must be a <i>documented exception</i>, not an accident. Checks all ${r.total} interface actions against the assistant's action registry.${r.complete?"":` <b>Partial scan</b> — reading the app source failed, so only actions currently rendered were checked.`}</p>
    ${r.gaps.length?`<div class="notice" style="border-left-color:var(--danger);background:var(--danger-soft);"><b>Unclassified or unreachable:</b><ul style="margin:0.3rem 0 0 1rem;">${gapRows}</ul></div>`:""}
    <div class="grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:0.6rem;margin-top:0.5rem;">
      <div><b style="font-size:0.8rem;">${r.covered.length} with an assistant equivalent</b>
        <div class="conf-note" style="margin-top:0.2rem;line-height:1.5;">${r.covered.map(c=>esc(c.action)).join(" · ")}</div></div>
      <div><b style="font-size:0.8rem;">${r.uiOnly.length} interface-only</b>
        <div class="conf-note" style="margin-top:0.2rem;line-height:1.5;">Navigation, filtering and dialogs — no workspace state to change.<br>${r.uiOnly.map(esc).join(" · ")}</div></div>
      <div><b style="font-size:0.8rem;">${r.exceptions.length} documented exceptions</b>
        <div class="conf-note" style="margin-top:0.2rem;line-height:1.5;">${r.exceptions.map(e=>`${esc(e.action)} <i>(${esc(e.reason)})</i>`).join(" · ")}</div></div>
      <div><b style="font-size:0.8rem;">${r.assistantOnly.length} assistant-only reads</b>
        <div class="conf-note" style="margin-top:0.2rem;line-height:1.5;">Structured reads with no single button behind them.<br>${r.assistantOnly.map(esc).join(" · ")}</div></div>
    </div>
  </div>`;
}

function journalPanelHTML(){
  const j = db.journal || [];
  if(!j.length) return `<div class="panel"><h3>Change journal</h3><p class="hint">No recorded changes yet. Every edit — yours or the assistant's — is credited to an actor and listed here.</p></div>`;
  const rows = j.slice(0,25).map(cs=>{
    const kept = (cs.ops||[]).filter(o=>o.status==="accepted"||o.status==="applied").length;
    const dropped = (cs.ops||[]).filter(o=>o.status==="rejected").length;
    return `<tr>
      <td>${esc(cs.created)}</td>
      <td>${actorRef(cs.actor)}${cs.human?` <span class="conf-note">direct</span>`:` <span class="conf-note">reviewed by ${cs.approvedBy?esc(actor(cs.approvedBy)?actor(cs.approvedBy).name:cs.approvedBy):"—"}</span>`}</td>
      <td>${esc(cs.task)}</td>
      <td>${kept} kept${dropped?` · ${dropped} rejected`:""}</td>
      <td><span class="conf-note">${esc(cs.status)}</span></td>
    </tr>`;
  }).join("");
  return `<div class="panel">
    <h3>Change journal <span class="conf-note">${j.length} entr${j.length===1?"y":"ies"}, newest first</span></h3>
    <p class="hint">Every edit is credited to whoever made it — human or LLM. Assistant changesets record which human accepted them; direct edits are marked <i>direct</i>. Retained for the last 50 changes and included in the workspace export.</p>
    <div class="gridwrap"><table class="grid"><thead><tr><th>Date</th><th>Actor</th><th>What</th><th>Ops</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function viewAnalyst(){
  const ns = needsSourcing(), ss = singleSource(), oc = openConflicts(), st = staleSources();
  const oqs = db.cards.filter(c=>c.type==="open_question" && c.status!=="deprecated" && c.status!=="answered");
  const gh = graphHealth();
  const cov = db.ws.criteria.map((cr,i)=>{
    const n = db.cards.filter(c=>c.status!=="deprecated" && (c.criteria||[]).includes(i)).length;
    return {cr, n};
  });
  const maxCov = Math.max(1, ...cov.map(x=>x.n));
  return `
  <div class="view-head"><span class="view-title">Audits &amp; health</span></div>
  <p class="view-sub">Deterministic checks, computed in code rather than judged by a model, so their
  answers are exact (FR-A4). The assistant is in the rail on the right and can run every audit
  here itself.</p>

  <div class="panel">
    <h3>Grounded search</h3>
    <div style="display:flex; gap:0.5rem; margin-bottom:0.6rem;">
      <input type="text" id="analystQ" class="searchbox" style="max-width:none;" placeholder="Search every card, source, and run… (e.g., LFP margin)" aria-label="Search workspace">
      <button class="btn primary" data-action="runSearch">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div class="panel">
    <h3>Decision-criteria coverage</h3>
    <p class="hint">How many active cards are marked as bearing on each criterion (FR-A4: “which criteria have no supporting cards?”).</p>
    ${cov.map(x=>`<div class="criteria-cov"><span style="min-width:16rem;">${esc(x.cr)}</span><span class="covbar" aria-hidden="true"><div style="width:${Math.round(100*x.n/maxCov)}%"></div></span><span style="font-variant-numeric:tabular-nums; color:${x.n===0?"var(--danger)":"var(--ink-2)"};">${x.n}${x.n===0?" — gap":""}</span></div>`).join("")}
  </div>

  <div class="panel" id="audit-conflicts">
    <h3>Open contradictions (${oc.length})</h3>
    ${oc.length? oc.map(([a,b])=>`<div class="hit"><span class="where">${cardRef(a.id)} ⚠ ${cardRef(b.id)}</span><br>${esc(a.statement)}<br><i>vs.</i> ${esc(b.statement)}<br><span style="font-size:0.7rem;color:var(--ink-3);">Resolve by editing one card, deprecating one, or recording the disagreement as a tradeoff (FR-C4).</span></div>`).join("") : `<div class="empty">None — every conflicts-with link is resolved.</div>`}
  </div>

  <div class="panel" id="audit-needs">
    <h3>Needs sourcing (${ns.length})</h3>
    <p class="hint">Facts, opportunities, tradeoffs, risks, and recommendations with zero citations are displayed as <b>unverified</b> regardless of their set confidence (FR-C3).</p>
    ${ns.length? ns.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)}</span> ${esc(c.statement)} <button class="btn small" data-action="editCard" data-id="${esc(c.id)}">Add citation</button></div>`).join("") : `<div class="empty">All substantive cards carry at least one citation.</div>`}
  </div>

  <div class="panel">
    <h3>Single-source facts (${ss.length})</h3>
    ${ss.length? ss.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)}</span> ${esc(c.statement)} <span style="font-size:0.7rem;color:var(--ink-3);">— corroborate before relying on it in a brief.</span></div>`).join("") : `<div class="empty">No facts rest on a single source.</div>`}
  </div>

  <div class="panel" id="audit-stale">
    <h3>Freshness check (${st.length})</h3>
    <p class="hint">Reports/datasets over 13 months old — check the publisher for a superseding edition (FR-L4, simplified heuristic).</p>
    ${st.length? st.map(s=>`<div class="hit"><span class="where">${esc(s.date)}</span> ${sourceRef(s.id,{full:true})} — cited by ${citingCards(s.id).map(c=>cardRef(c.id)).join(", ")||"0 cards"}</div>`).join("") : `<div class="empty">No stale sources.</div>`}
  </div>

  <div class="panel">
    <h3>Open-question queue (${oqs.length})</h3>
    ${oqs.length? oqs.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)} · ${esc(c.status)}</span> ${esc(c.statement)}</div>`).join("") : `<div class="empty">No open questions.</div>`}
  </div>

  <div class="panel">
    <h3>Graph health (${gh.orphans.length + gh.unjustified.length + gh.inert.length})</h3>
    <p class="hint">Every justification is assembled from the links between cards, so a missing link is a real gap: it makes a case look thinner than it is. These cards the graph cannot yet reason about.</p>
    <h4 style="font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); margin:0.8rem 0 0.3rem;">Unjustified recommendations (${gh.unjustified.length})</h4>
    ${gh.unjustified.length? gh.unjustified.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)}</span> ${esc(c.statement)} <button class="btn small just" data-action="trace" data-id="${esc(c.id)}">Link its evidence</button></div>`).join("")
      : `<div class="empty">Every recommendation has a supporting chain.</div>`}
    <h4 style="font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); margin:0.8rem 0 0.3rem;">Assumptions nothing depends on (${gh.inert.length})</h4>
    ${gh.inert.length? gh.inert.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)}</span> ${esc(c.statement)} <span class="conf-note">— either something rests on it and the link is missing, or it is dead weight.</span></div>`).join("")
      : `<div class="empty">Every assumption has something resting on it.</div>`}
    <h4 style="font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); margin:0.8rem 0 0.3rem;">Orphan cards — no links in or out (${gh.orphans.length})</h4>
    ${gh.orphans.length? gh.orphans.map(c=>`<div class="hit"><span class="where">${cardRef(c.id)}</span> ${esc(c.statement)} <button class="btn small" data-action="trace" data-id="${esc(c.id)}">Link it</button></div>`).join("")
      : `<div class="empty">No orphans — every card is connected to the argument.</div>`}
  </div>
  ${parityPanelHTML()}
  ${journalPanelHTML()}`;
}

function viewSettings(){
  return `
  <div class="view-head"><span class="view-title">Settings &amp; data</span></div>

/* A compact rendering of the top rows, so a run promoted to the library reads
   as evidence ("who got what, for what") rather than just a row count.
   Column-agnostic: identifying columns first, any amount column in brackets. */
function runHighlights(data){
  if(data && data.artifacts && data.artifacts.length && (!data.rows || !data.rows.length))
    return `Captured ${data.artifacts.length} chart(s): ${data.artifacts.map(a=>a.label).join("; ")}. Figures read from them are estimates.`;
  if(!data || !data.rows || !data.rows.length) return "";
  const amountCol = data.columns.find(c=>/amount|value/i.test(c));
  const idCols = data.columns.filter(c=>c!==amountCol).slice(0,3);
  const fmt = v => v==null ? "" : (typeof v==="number" ? v.toLocaleString("en-US",{maximumFractionDigits:0}) : String(v));
  const top = data.rows.slice(0,5).map(r=>{
    const label = idCols.map(c=>fmt(r[c])).filter(v=>v && v!=="—").join(" — ");
    return amountCol ? `${label} [${fmt(r[amountCol])}]` : label;
  }).filter(Boolean);
  const more = data.rows.length - top.length;
  return `Top rows: ${top.join(" · ")}${more>0?` …and ${more} more.`:""}`;
}

/* Direct execution: LODESTONE calls the model's API itself and records the run
   with full provenance, so nothing is transcribed by hand. */
function runNowForm(modelId, state){
  const m = db.models.find(x=>x.id===modelId);
  const spec = modelRun(modelId);
  state = state || {};
  const fields = spec.params.map(p=>`<div class="frow"><label for="rn-${esc(p.name)}">${esc(p.label)}</label>
    <input type="text" id="rn-${esc(p.name)}" value="${esc(state.params && state.params[p.name] !== undefined ? state.params[p.name] : p.value)}"></div>`).join("");
  let results = "";
  if(state.error) results = `<div class="notice" style="border-left-color:var(--danger); background:var(--danger-soft);">${esc(state.error)}</div>`;
  else if(state.result){
    const r = state.result;
    const arts = (r.artifacts||[]).map(a=>`<figure style="margin:0 0 0.9rem;">
        <img src="${esc(a.dataUri)}" alt="${esc(a.label)}" style="max-width:100%; border:1px solid var(--line); border-radius:6px;">
        <figcaption class="conf-note" style="margin-top:0.25rem;">${esc(a.label)}</figcaption>
      </figure>`).join("");
    const extraction = r.extraction==="artifact"
      ? `<div class="notice"><b>Charts, not numbers.</b> This tool has no data export, so the run captures the plots exactly as the model drew them. Any figure you read off these charts is an <b>estimate</b> — record it at <i>probable</i> confidence at best, never <i>established</i>.</div>`
      : r.extraction==="exact"
      ? `<div class="notice" style="border-left-color:var(--good); background:var(--good-soft);"><b>Exact values.</b> Recalculated by the model's own engine, so these figures are model output and can be cited as such.</div>`
      : r.extraction==="cached"
      ? `<div class="notice"><b>Cached values.</b> Read from the workbook without recalculation — they reflect whatever scenario was last saved, not your inputs.</div>`
      : "";
    results = `<div class="tsec"><h4>Result</h4>
      <p style="font-size:0.84rem; margin:0 0 0.6rem;">${esc(r.summary)}</p>
      ${extraction}
      ${arts}
      ${r.rows&&r.rows.length?resultTableHTML(r):""}
      <div class="provenance">${esc(r.endpoint)} · ${r.rows?`${r.rows.length} row(s)`:`${(r.artifacts||[]).length} chart(s)`} · ${r.ms} ms · recorded as ${esc(state.runId||"—")}</div>
      <p class="hint">Saved with the full table under <b>Recorded runs</b>, at the top of Models &amp; runs.</p>
    </div>`;
  }
  openDlg(`
  <div class="dlg-head"><span>Run — ${esc(m.name)}</span><button class="btn small" data-action="closeDlg">✕</button></div>
  <div class="dlg-body">
    <p class="hint" style="margin-top:0;">LODESTONE calls this model's public API directly and captures the run for you. ${esc(spec.note||"")}</p>
    ${fields}
    ${results}
  </div>
  <div class="dlg-foot">
    ${state.runId?`<button class="btn" data-action="gotoRun" data-id="${esc(state.runId)}" style="margin-right:auto;">Show the saved record</button>`:""}
    <button class="btn" data-action="closeDlg">Close</button>
    <button class="btn primary" data-action="doRun" data-id="${esc(modelId)}">${state.busy?"Running…":"▶ Run"}</button>
  </div>`);
}

async function doRun(modelId){
  const spec = modelRun(modelId);
  const params = {};
  spec.params.forEach(p=>{ const el = document.getElementById("rn-"+p.name); params[p.name] = el ? el.value.trim() : p.value; });
  runNowForm(modelId, { params, busy:true });
  try {
    const resp = await fetch("api/run", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({modelId, params}) });
    const data = await resp.json();
    if(!resp.ok){ runNowForm(modelId, { params, error: data.error || `Run failed (${resp.status})` }); return; }
    const m = db.models.find(x=>x.id===modelId);
    const run = {
      id: uid("run"), modelId,
      name: `${m.name} — ${new Date().toISOString().slice(0,16).replace("T"," ")}`,
      params: Object.entries(params).map(([k,v])=>`${k}=${v}`).join("; "),
      outputs: `${data.summary} ${runHighlights(data)}`.trim(),
      notes: `Executed by LODESTONE against ${data.endpoint} in ${data.ms} ms.`,
      date: today(), runner: "LODESTONE (automatic)", sourceId: null,
      // Keep the rows so the result stays re-viewable after the dialog closes.
      result: { columns: data.columns, rows: data.rows, summary: data.summary, endpoint: data.endpoint, ms: data.ms,
                artifacts: data.artifacts, extraction: data.extraction, appliedParams: data.appliedParams },
    };
    db.runs.push(run); highlightRunId = run.id; save();
    runNowForm(modelId, { params, result: data, runId: run.id });
    toast(`Run recorded as ${run.id}`);
  } catch(e) {
    // Distinguish "the request failed" from "the request succeeded but
    // displaying it threw" — the run may already be recorded.
    const networkish = (e instanceof TypeError) && /fetch|network|Failed to fetch/i.test(String(e.message));
    const saved = db.runs.length && db.runs[db.runs.length-1].modelId === modelId;
    runNowForm(modelId, { params, error: networkish
      ? "Could not reach the local server — is `npm start` running?"
      : `${saved ? "The run completed and was recorded, but displaying it failed" : "The run failed"}: ${e && e.message ? e.message : e}` });
  }
}
