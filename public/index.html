/* ---------------- Brief / exports ---------------- */
function buildMemo(){
  const sel = db.cards.filter(c=>briefSel.has(c.id) && c.status!=="deprecated");
  const usedSources = [];
  const srcNum = id => { let i = usedSources.indexOf(id); if(i===-1){ usedSources.push(id); i = usedSources.length-1; } return i+1; };
  let md = `# Decision memo — ${db.ws.title}\n\n**Decision question:** ${db.ws.question}\n\n**Decision criteria:** ${db.ws.criteria.join("; ")}\n\n_Generated ${today()} from the LODESTONE workspace (${sel.length} cards). Confidence labels: established / probable / contested / unverified. Cards with no citations are marked unverified by rule._\n\n`;
  Object.keys(TYPES).forEach(t=>{
    const cs = sel.filter(c=>c.type===t);
    if(!cs.length) return;
    md += `## ${TYPES[t].plural}\n\n`;
    cs.forEach(c=>{
      const refs = c.citations.map(x=>`[${srcNum(x.sourceId)}${x.locator?`, ${x.locator}`:""}]`).join("");
      md += `- **${c.id}** (${effConfidence(c)}${c.status!=="active"?`, ${c.status}`:""}) — ${c.statement}${refs? " "+refs:""}\n`;
      if(c.detail) md += `  - ${c.detail}\n`;
      if(hasConflict(c)) md += `  - ⚠ Unresolved conflict — see linked cards.\n`;
    });
    md += "\n";
  });
  if(usedSources.length){
    md += `## Sources\n\n`;
    usedSources.forEach((id,i)=>{
      const s = source(id);
      if(s) md += `${i+1}. ${s.author} — *${s.title}* (${s.date}). ${s.url||""}${s.access!=="open"?` [${s.access}]`:""}\n`;
    });
  }
  md += `\n---\n_Prototype export. In the deployed system this brief would carry the immutable snapshot IDs of every citation (NFR-6) and the audit log of card provenance (FR-G2)._\n`;
  return md;
}
function buildBiblio(){
  let md = `# Bibliography — ${db.ws.title}\n\n`;
  db.lists.forEach(l=>{
    md += `## ${l.title}\n\n`;
    l.items.forEach((it,i)=>{ const s=source(it.sourceId); if(s){ md += `${i+1}. ${s.author} — *${s.title}* (${s.date}). ${s.url||""}\n${it.note?`   — ${it.note}\n`:""}`; } });
    md += "\n";
  });
  md += `## Full library\n\n`;
  db.sources.forEach(s=>{ md += `- ${s.author} — *${s.title}* (${s.date}). ${s.kind}, ${s.access}. ${s.url||""}\n`; });
  return md;
}
async function offerDownload(filename, data){
  if(window.claude && window.claude.downloads){
    try { await window.claude.downloads.save({filename, data}); toast("Saved: " + filename); return; }
    catch(e){
      if(e && e.code==="declined"){ toast("Save declined"); return; }
      if(e && e.code==="rate_limited"){ toast("A save prompt is already open — try again shortly"); return; }
      /* fall through to clipboard on unavailable/etc. */
    }
  }
  try { await navigator.clipboard.writeText(data); toast("Download unavailable here — copied to clipboard instead"); }
  catch(e){ toast("Could not save or copy — select text from the preview and copy manually"); }
}

/* ---------------- Search ---------------- */
function runSearch(){
  const qEl = document.getElementById("analystQ");
  const q = (qEl.value||"").trim().toLowerCase();
  const out = document.getElementById("searchResults");
  if(!q){ out.innerHTML = `<div class="empty">Type a query.</div>`; return; }
  const mark = txt => esc(txt).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>");
  const hits = [];
  db.cards.forEach(c=>{
    if((c.statement+" "+c.detail+" "+c.tags.join(" ")).toLowerCase().includes(q))
      hits.push(`<div class="hit"><span class="where">Card ${cardRef(c.id)} · ${TYPES[c.type].label} · ${esc(effConfidence(c))}</span><br>${mark(c.statement)}${c.detail?`<br><span style="font-size:0.74rem;color:var(--ink-2);">${mark(c.detail)}</span>`:""}</div>`);
  });
  db.sources.forEach(s=>{
    if((s.title+" "+s.author+" "+s.notes).toLowerCase().includes(q))
      hits.push(`<div class="hit"><span class="where">Source · ${sourceRef(s.id)} (${esc(s.date)})</span><br>${mark(s.title)}${s.notes?`<br><span style="font-size:0.74rem;color:var(--ink-2);">${mark(s.notes)}</span>`:""}</div>`);
  });
  db.runs.forEach(r=>{
    if((r.name+" "+r.params+" "+r.outputs+" "+r.notes).toLowerCase().includes(q))
      hits.push(`<div class="hit"><span class="where">Model run · ${esc(r.date)}</span><br>${mark(r.name)}<br><span style="font-size:0.74rem;">${mark(r.outputs)}</span></div>`);
  });
  out.innerHTML = hits.length? hits.join("") : `<div class="empty">No matches in cards, sources, or runs. (In the deployed system, the assistant would offer web-search mode here — FR-A2.)</div>`;
}

/* ---------------- Event handling ---------------- */
document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;

  if(a==="nav"){ view = el.dataset.view; if(view==="board"&&el.dataset.type){filters.type=el.dataset.type;} render(); }
  else if(a==="navtype"){ view="board"; filters.type = el.dataset.type; filters.q=""; render(); }
  else if(a==="navaudit"){ view="analyst"; render(); const id = {needs:"audit-needs",conflicts:"audit-conflicts",stale:"audit-stale"}[el.dataset.audit]; const t=document.getElementById(id); if(t) t.scrollIntoView({behavior:"smooth"}); }
  else if(a==="ftype"){ filters.type = el.dataset.type; render(); }
  else if(a==="ftag"){ filters.tag = (filters.tag===el.dataset.tag? "" : el.dataset.tag); render(); }
  else if(a==="newCard"){ cardForm(null); }
  else if(a==="editCard"){ cardForm(card(el.dataset.id)); }
  else if(a==="trace"){ openTrace(el.dataset.id); }
  else if(a==="sourceDetail"){ hideTip(); openSource(el.dataset.id); }
  else if(a==="traceBack"){ traceBack(); }
  else if(a==="traceCrumb"){ traceGoto(+el.dataset.i); }
  else if(a==="showOnBoard"){
    const id = el.dataset.id;
    closeDlg(); view="board"; filters={type:"all", q:id, tag:""}; render();
    toast(`Board filtered to ${id} — clear the filter box to see everything`);
  }
  else if(a==="addLinkFromTrace"){
    const rootId = el.dataset.id, rel = document.getElementById("lk-rel").value, to = document.getElementById("lk-to").value;
    const c = card(rootId);
    if(!c || !to){ toast("Pick a card to link to"); return; }
    if(c.links.some(l=>l.to===to && l.rel===rel)){ toast("That link already exists"); return; }
    c.links.push({to, rel}); c.updated = today(); save();
    openDlg(traceHTML(rootId)); dlg.classList.add("trace");
    toast(`Linked: ${rootId} ${rel} ${to}`);
  }
  else if(a==="closeDlg"){ closeDlg(); }
  else if(a==="draftAddCite"){ collectCardForm(); draft.citations.push({sourceId:document.getElementById("cf-cite-src").value, locator:document.getElementById("cf-cite-loc").value.trim()}); renderCardForm(); }
  else if(a==="draftRmCite"){ collectCardForm(); draft.citations.splice(+el.dataset.i,1); renderCardForm(); }
  else if(a==="draftAddLink"){ collectCardForm(); const to=document.getElementById("cf-link-to").value; if(to) draft.links.push({to, rel:document.getElementById("cf-link-rel").value}); renderCardForm(); }
  else if(a==="draftRmLink"){ collectCardForm(); draft.links.splice(+el.dataset.i,1); renderCardForm(); }
  else if(a==="saveCard"){
    collectCardForm();
    if(!draft.statement){ toast("Statement is required"); return; }
    if(!draft.id){
      draft.id = uid(TYPES[draft.type].prefix);
      draft.created = today(); draft.updated = today();
      stampCreate(draft);
      db.cards.push(draft);
      journalHuman(`Create ${draft.id} (${TYPES[draft.type].label})`, {card:draft.id});
    } else {
      const i = db.cards.findIndex(c=>c.id===draft.id);
      draft.updated = today();
      stampUpdate(draft);
      db.cards[i] = draft;
      journalHuman(`Edit ${draft.id}`, {card:draft.id});
    }
    save(); closeDlg(); render(); toast("Card saved");
  }
  else if(a==="deprecateCard"){ collectCardForm(); draft.status="deprecated"; stampUpdate(draft); const i=db.cards.findIndex(c=>c.id===draft.id); db.cards[i]=draft; journalHuman(`Deprecate ${draft.id}`, {card:draft.id}); save(); closeDlg(); render(); toast("Card deprecated (kept for the record; excluded from views and briefs)"); }
  else if(a==="newSource"){ sourceForm(null); }
  else if(a==="editSource"){ sourceForm(source(el.dataset.id)); }
  else if(a==="saveSource"){
    const id = el.dataset.id;
    const s = id? source(id) : {id:uid("s"), addedAt:today()};
    s.title = document.getElementById("sf-title").value.trim();
    s.author = document.getElementById("sf-author").value.trim();
    s.date = document.getElementById("sf-date").value.trim();
    s.kind = document.getElementById("sf-kind").value;
    s.access = document.getElementById("sf-access").value;
    s.url = document.getElementById("sf-url").value.trim();
    s.notes = document.getElementById("sf-notes").value.trim();
    if(!s.title){ toast("Title is required"); return; }
    if(!id) db.sources.push(s);
    save(); closeDlg(); render(); toast("Source saved");
  }
  else if(a==="delSource"){ const n=citingCards(el.dataset.id).length; if(n){ toast("Cited by cards — cannot delete"); return; } db.sources = db.sources.filter(s=>s.id!==el.dataset.id); db.lists.forEach(l=>l.items=l.items.filter(it=>it.sourceId!==el.dataset.id)); save(); render(); toast("Source deleted"); }
  else if(a==="newList"){ const t = prompt("Reading-list title:"); if(t){ db.lists.push({id:uid("rl"), title:t, items:[]}); save(); render(); } }
  else if(a==="delList"){ db.lists = db.lists.filter(l=>l.id!==el.dataset.id); save(); render(); }
  else if(a==="listAdd"){ const l = db.lists.find(x=>x.id===el.dataset.list); const sel = document.getElementById("addTo-"+l.id); if(sel && sel.value){ l.items.push({sourceId:sel.value, note:""}); save(); render(); } }
  else if(a==="listRemove"){ const l = db.lists.find(x=>x.id===el.dataset.list); l.items.splice(+el.dataset.i,1); save(); render(); }
  else if(a==="listMove"){ const l = db.lists.find(x=>x.id===el.dataset.list); const i=+el.dataset.i, d=+el.dataset.dir; const [it]=l.items.splice(i,1); l.items.splice(i+d,0,it); save(); render(); }
  else if(a==="recordRun"){ runForm(el.dataset.id); }
  else if(a==="runNow"){ runNowForm(el.dataset.id); }
  else if(a==="viewRun"){ openRunResult(el.dataset.id); }
  else if(a==="gotoRun"){ closeDlg(); highlightRunId = el.dataset.id; view="models"; render(); }
  else if(a==="doRun"){ doRun(el.dataset.id); }
  else if(a==="saveRun"){
    const name = document.getElementById("rf-name").value.trim();
    const params = document.getElementById("rf-params").value.trim();
    const outputs = document.getElementById("rf-out").value.trim();
    if(!name || !outputs){ toast("Name and outputs are required — record what the tool actually returned"); return; }
    db.runs.push({id:uid("run"), modelId:el.dataset.model, name, params, outputs, notes:document.getElementById("rf-notes").value.trim(), date:today(), runner:"user", sourceId:null});
    save(); closeDlg(); render(); toast("Run recorded");
  }
  else if(a==="delRun"){ db.runs = db.runs.filter(r=>r.id!==el.dataset.id); save(); render(); }
  else if(a==="promoteRun"){
    const r = db.runs.find(x=>x.id===el.dataset.id);
    const m = db.models.find(x=>x.id===r.modelId);
    const s = {id:uid("s"), kind:"model run", title:`Model run: ${r.name} (${m?m.name:"?"})`, author:"Workspace model run", date:r.date, url:m?m.url:"", access:"open", notes:`Params: ${r.params} | Outputs: ${r.outputs}${r.notes?` | Notes: ${r.notes}`:""}`, addedAt:today()};
    db.sources.push(s); r.sourceId = s.id; save(); render(); toast("Run saved to library — it can now be cited by cards");
  }
  else if(a==="runSearch"){ runSearch(); }
  else if(a==="briefToggle"){ if(el.checked) briefSel.add(el.dataset.id); else briefSel.delete(el.dataset.id); }
  else if(a==="briefAll"){ briefSel = new Set(db.cards.filter(c=>c.status!=="deprecated").map(c=>c.id)); render(); }
  else if(a==="briefNone"){ briefSel = new Set(); render(); }
  else if(a==="genBrief"){ document.getElementById("memoPreview").textContent = buildMemo(); }
  else if(a==="dlMemo"){ offerDownload("lodestone-memo.md", buildMemo()); }
  else if(a==="dlBiblio"){ offerDownload("lodestone-bibliography.md", buildBiblio()); }
  else if(a==="dlJson"){ offerDownload("lodestone-workspace.json", JSON.stringify(db, null, 2)); }
  else if(a==="saveWs"){
    db.ws.title = document.getElementById("setTitle").value.trim() || db.ws.title;
    db.ws.question = document.getElementById("setQ").value.trim();
    db.ws.criteria = document.getElementById("setCrit").value.split("\n").map(x=>x.trim()).filter(Boolean);
    save(); render(); toast("Workspace settings saved");
  }
  else if(a==="saveAsst"){
    const rounds = Math.max(1, Math.min(16, Number(document.getElementById("setRounds").value) || 8));
    db.settings.activeActor = document.getElementById("setActor").value;
    db.settings.assistantActor = document.getElementById("setAsstActor").value;
    db.settings.approvalMode = document.getElementById("setApproval").value;
    db.settings.maxToolRounds = rounds;
    save(); render(); toast("Assistant settings saved");
  }
  else if(a==="resetSeed"){
    if(confirm("Replace the current workspace with the seeded demo data? Unexported changes will be lost.")){
      db = seedData(); save(); briefSel=null; render(); toast("Workspace reset to seed");
    }
  }
});

document.addEventListener("input", ev=>{
  if(ev.target.id==="boardQ"){ filters.q = ev.target.value; const scroll=window.scrollY; render(); const q=document.getElementById("boardQ"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); window.scrollTo(0,scroll); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Enter" && ev.target.id==="analystQ"){ runSearch(); }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="importFile"){
    const f = ev.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!data.cards || !data.sources || !data.ws) throw new Error("not a LODESTONE workspace");
        db = data; save(); briefSel=null; render(); toast("Workspace imported");
      } catch(e){ toast("Import failed: " + e.message); }
    };
    reader.readAsText(f);
  }
});

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------------- Init ---------------- */
load();
render();
detectCaps();
</script>
